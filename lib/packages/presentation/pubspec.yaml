name: presentation
description: "A new Flutter package project."
version: 0.0.1
homepage:
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  domain:
    path: ../domain

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  retrofit: ^4.5.0
  flutter_riverpod: ^3.0.0-dev.17
  riverpod_annotation: ^3.0.0-dev.17
  flutter_svg: ^2.2.0
  table_calendar: ^3.2.0
  go_router: ^16.2.0
  go_router_builder: ^3.2.1
  smooth_page_indicator: ^1.2.1
  get_it: ^8.2.0
  freezed: ^3.2.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.5
  riverpod_generator: ^3.0.0-dev.17
  build_runner: ^2.7.0
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0-dev.17
  build_verify: ^3.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: pretendard
      fonts:
        - asset: assets/fonts/pretendard_700.otf
          weight: 700
        - asset: assets/fonts/pretendard_400.otf
          weight: 400
    - family: gangwoneduall
      fonts:
        - asset: assets/fonts/gangwoneduall_otf_bold.otf
          weight: 700
        - asset: assets/fonts/gangwoneduall_otf_light.otf
          weight: 400
