name: fillsa_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^3.0.0-dev.17
  riverpod_annotation: ^3.0.0-dev.17
  flutter_svg: ^2.2.0
  table_calendar: ^3.2.0
  go_router: ^16.2.0
  go_router_builder: ^4.0.1
  smooth_page_indicator: ^1.2.1
  json_serializable: ^6.9.5
  get_it: ^8.2.0
  logger: ^2.3.0
  retrofit: ^4.1.0
  injectable: ^2.4.2
  json_annotation: 4.9.0
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.3
  drift_flutter: ^0.2.6
  drift: ^2.28.1
  drift_dev: ^2.28.2
  intl: ^0.20.2
  riverpod: ^3.0.0-dev.17
  google_sign_in: ^7.1.1
  flutter_localization: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  freezed: ^3.2.0
  json_serializable: ^6.9.5
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.0-dev.17
  build_runner: ^2.7.0
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0-dev.17
  build_verify: ^3.1.1
  injectable_generator: ^2.6.1
  retrofit_generator: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: pretendard
      fonts:
        - asset: assets/fonts/pretendard_400.otf
          weight: 400
        - asset: assets/fonts/pretendard_700.otf
          weight: 700

    - family: gangwoneduall
      fonts:
        - asset: assets/fonts/gangwoneduall_otf_light.otf
          weight: 400